<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>線上即時值班儀表板 (1080p 滿版月曆)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --holiday-bg: rgba(239, 68, 68, 0.15);
      --holiday-border: #ef4444;
      --holiday-text: #fca5a5;
      --swap-bg: #f97316;
      --swap-text: #ffffff;
      --cell-hover: #273549;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* 確保 1920x1080 單頁完全不用下拉滾動 */
      background: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    .dashboard-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 24px;
    }

    /* 頂部控制列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 56px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .badge-sync {
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover:not(:disabled) {
      background: #334155;
      border-color: var(--primary);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .current-month-display {
      font-size: 24px;
      font-weight: 800;
      min-width: 180px;
      text-align: center;
      color: var(--primary);
    }

    /* 星期標題表頭 */
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      height: 36px;
      flex-shrink: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .calendar-weekdays div.weekend {
      color: #f87171;
    }

    /* 月曆主表格網格 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      flex-grow: 1;
      height: calc(100vh - 120px); /* 精確扣除頂部空間，達成 1080p 零捲動 */
    }

    /* 單日格子 (大字體設計) */
    .calendar-day {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .calendar-day:hover {
      background: var(--cell-hover);
      border-color: var(--primary);
    }

    .calendar-day.empty {
      background: transparent;
      border: 1px dashed rgba(51, 65, 85, 0.4);
      cursor: default;
    }

    .calendar-day.is-holiday {
      background: var(--holiday-bg);
      border-color: var(--holiday-border);
    }

    .calendar-day.is-today {
      box-shadow: inset 0 0 0 2px var(--primary);
    }

    /* 日期頂部列 */
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .day-number {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
    }

    .is-holiday .day-number {
      color: #fca5a5;
    }

    .holiday-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.25);
      color: var(--holiday-text);
      max-width: 65%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workday-makeup-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }

    /* 值班人員核心區 (超大醒目字體) */
    .duty-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: auto 0;
    }

    .person-name {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      word-break: break-all;
    }

    .empty-person {
      font-size: 16px;
      color: var(--text-muted);
      font-weight: normal;
    }

    /* 調班專用標籤 */
    .swap-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 800;
      background: var(--swap-bg);
      color: var(--swap-text);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* 備註與交接資訊 */
    .duty-notes {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 18px;
    }

    /* 彈跳視窗 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 480px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal h2 { margin-top: 0; font-size: 20px; color: var(--primary); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input, .form-group textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 15px;
    }
    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .form-checkbox input { width: 18px; height: 18px; cursor: pointer; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="dashboard-container">
  <!-- 頂部導航 -->
  <header>
    <div class="title-group">
      <h1>線上值班儀表板</h1>
      <span class="badge-sync" id="syncStatus">資料庫同步中...</span>
    </div>

    <div class="nav-controls">
      <button class="btn" id="prevMonthBtn">◀ 上一月</button>
      <div class="current-month-display" id="monthDisplay">2026 年 10 月</div>
      <button class="btn" id="nextMonthBtn">下一月 ▶</button>
      <button class="btn" style="background:#0284c7; margin-left:12px;" id="configRotationBtn">⚙️ 重設排班輪替</button>
    </div>
  </header>

  <!-- 星期表頭 -->
  <div class="calendar-weekdays">
    <div class="weekend">週日</div>
    <div>週一</div>
    <div>週二</div>
    <div>週三</div>
    <div>週四</div>
    <div>週五</div>
    <div class="weekend">週六</div>
  </div>

  <!-- 月曆主體網格 (1920x1080 滿版) -->
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- 編輯單日資料 Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2 id="modalDateTitle">編輯值班資訊</h2>
    <div class="form-group">
      <label>值班人員名稱</label>
      <input type="text" id="modalPerson" placeholder="請輸入姓名" />
    </div>
    <div class="form-group">
      <label class="form-checkbox">
        <input type="checkbox" id="modalSwapped" />
        <span>此日有換過班（加註「調班」標記）</span>
      </label>
    </div>
    <div class="form-group">
      <label>交接備忘事項</label>
      <textarea id="modalNote" rows="3" placeholder="例如：機台保養、特殊測試批 (Split Lot) 交代"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn" style="background:#22c55e;" onclick="saveDayData()">儲存更新</button>
    </div>
  </div>
</div>

<!-- 設定輪替規則 Modal (僅自指定日期後生效) -->
<div class="modal-overlay" id="rotationModal">
  <div class="modal" style="width: 520px;">
    <h2>重新設定輪替規則 (歷史紀錄保持不變)</h2>
    <p style="font-size: 13px; color: var(--text-muted);">
      ⚠️ 說明：重新設定後，系統將<strong>僅從所選生效日期起</strong>開始套用新輪替順序，該日期之前的歷史排班一律固定保留，不作任何變更。
    </p>
    <div class="form-group">
      <label>生效起始日期（不能早於 2026-10-01）</label>
      <input type="date" id="rotEffectiveDate" min="2026-10-01" />
    </div>
    <div class="form-group">
      <label>輪值人員名單（依序以逗號分隔）</label>
      <input type="text" id="rotMembers" placeholder="例：王小明, 李大華, 陳建宏, 林佩君" />
    </div>
    <div class="form-group">
      <label>首日開始值班的人員名稱</label>
      <input type="text" id="rotStartPerson" placeholder="請輸入名單中第一位值班人員" />
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeRotationModal()">取消</button>
      <button class="btn" style="background:#0284c7;" onclick="saveRotationRule()">確認生效並向後計算</button>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // 1. Firebase 金鑰設定（請替換為步驟三產生的金鑰）
  // ==========================================
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const scheduleRef = db.ref("duty_schedule");
  const rotationRef = db.ref("duty_rotation_anchors");

  // ==========================================
  // 2. 嚴格邊界設定：2026/10 之前不要有資料
  // ==========================================
  const MIN_YEAR = 2026;
  const MIN_MONTH = 9; // 0-based，9 代表 10 月

  let currentYear = 2026;
  let currentMonth = 9;

  let holidaysCache = {};
  let scheduleData = {};
  let rotationAnchors = []; // 儲存多個生效錨點 [{ effectiveDate: '2026-10-01', members: [...], startIndex: 0 }]
  let activeEditDate = null;

  // ==========================================
  // 3. 自動向政府開放行事曆抓取國定假日 (如 2/4~2/10 春節連假)
  // ==========================================
  async function fetchHolidays(year) {
    if (holidaysCache[year]) return;
    try {
      const res = await fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${year}.json`);
      if (res.ok) {
        const list = await res.json();
        list.forEach(i => {
          const d = `${i.date.slice(0,4)}-${i.date.slice(4,6)}-${i.date.slice(6,8)}`;
          holidaysCache[d] = { isHoliday: i.isHoliday, desc: i.description };
        });
      }
    } catch(e) {
      console.warn("國定日曆 API 連線超時，使用離線備援演算法", e);
    }
  }

  // ==========================================
  // 4. 計算指定日期依輪替規則應排之人員
  // ==========================================
  function computeRotatedPerson(dateStr) {
    if (rotationAnchors.length === 0) return "";

    // 依日期由新至舊排序錨點
    const sorted = [...rotationAnchors].sort((a,b) => b.effectiveDate.localeCompare(a.effectiveDate));
    // 找出最接近且 <= 該日期的錨點
    const anchor = sorted.find(a => dateStr >= a.effectiveDate);
    if (!anchor || !anchor.members || anchor.members.length === 0) return "";

    // 計算相差天數
    const tTarget = new Date(dateStr).getTime();
    const tAnchor = new Date(anchor.effectiveDate).getTime();
    const diffDays = Math.floor((tTarget - tAnchor) / (1000 * 60 * 60 * 24));
    if (diffDays < 0) return "";

    const idx = (anchor.startIndex + diffDays) % anchor.members.length;
    return anchor.members[idx];
  }

  // ==========================================
  // 5. 渲染月曆 (1920x1080 滿版單頁無捲動)
  // ==========================================
  async function renderCalendar() {
    await fetchHolidays(currentYear);

    // 檢查上一月按鈕是否觸碰 2026/10 下限
    const prevBtn = document.getElementById("prevMonthBtn");
    if (currentYear === MIN_YEAR && currentMonth === MIN_MONTH) {
      prevBtn.disabled = true;
    } else {
      prevBtn.disabled = false;
    }

    document.getElementById("monthDisplay").innerText = `${currentYear} 年 ${currentMonth + 1} 月`;

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay(); // 本月 1 號星期幾
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate(); // 本月總天數

    // 補齊前置空白格
    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "calendar-day empty";
      grid.appendChild(emptyCell);
    }

    // 當前實際真實日期（供今天高亮標註）
    const realToday = new Date();
    const realTodayStr = `${realToday.getFullYear()}-${String(realToday.getMonth()+1).padStart(2,'0')}-${String(realToday.getDate()).padStart(2,'0')}`;

    for (let day = 1; day <= totalDays; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();

      // 國定假日判定
      const hol = holidaysCache[dateStr];
      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
     const isOff = hol ? hol.isHoliday : isWeekend;

      let tagHtml = "";
      if (hol) {
        if (hol.isHoliday) {
          tagHtml = `<span class="holiday-tag" title="${hol.desc || '國定假日'}">${hol.desc || '放假'}</span>`;
        } else if (!hol.isHoliday && isWeekend) {
          tagHtml = `<span class="workday-makeup-tag">補班日</span>`;
        }
      }

      // 取得 Firebase 中的個別儲存紀錄
      const record = scheduleData[dateStr] || {};
      const isSwapped = !!record.isSwapped;
      
      // 人員判定：優先使用手動/儲存值，若無則依生效輪替推算
      let displayPerson = record.person;
      if (displayPerson === undefined || displayPerson === null || displayPerson === "") {
        displayPerson = computeRotatedPerson(dateStr);
      }

      const note = record.note || "";

      const cell = document.createElement("div");
      cell.className = `calendar-day ${isOff ? 'is-holiday' : ''} ${dateStr === realTodayStr ? 'is-today' : ''}`;
      cell.onclick = () => openEditModal(dateStr, displayPerson, isSwapped, note);

      cell.innerHTML = `
        <div class="day-header">
          <span class="day-number">${day}</span>
          ${tagHtml}
        </div>
        <div class="duty-body">
          <div class="person-name">
            ${displayPerson ? `<span>${displayPerson}</span>` : `<span class="empty-person">未排定</span>`}
            ${isSwapped ? `<span class="swap-badge">調班</span>` : ''}
          </div>
        </div>
        <div class="duty-notes" title="${note}">${note ? '📝 ' + note : ''}</div>
      `;

      grid.appendChild(cell);
    }
  }

  // ==========================================
  // 6. 模態視窗與編輯處理（調班註記、人員儲存）
  // ==========================================
  function openEditModal(dateStr, person, isSwapped, note) {
    activeEditDate = dateStr;
    document.getElementById("modalDateTitle").innerText = `編輯值班資訊 (${dateStr})`;
    document.getElementById("modalPerson").value = person || "";
    document.getElementById("modalSwapped").checked = isSwapped;
    document.getElementById("modalNote").value = note || "";
    document.getElementById("editModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("editModal").style.display = "none";
  }

  function saveDayData() {
    if (!activeEditDate) return;
    const person = document.getElementById("modalPerson").value.trim();
    const isSwapped = document.getElementById("modalSwapped").checked;
    const note = document.getElementById("modalNote").value.trim();

    // 儲存至 Firebase 即時資料庫
    scheduleRef.child(activeEditDate).set({
      person: person,
      isSwapped: isSwapped,
      note: note,
      lastUpdated: Date.now()
    }).then(() => {
      closeModal();
    });
  }

  // ==========================================
  // 7. 輪替規則設定：只從設定的那天之後開始生效
  // ==========================================
  document.getElementById("configRotationBtn").onclick = () => {
    document.getElementById("rotationModal").style.display = "flex";
  };
  function closeRotationModal() {
    document.getElementById("rotationModal").style.display = "none";
  }

  function saveRotationRule() {
    const effDate = document.getElementById("rotEffectiveDate").value;
    const membersRaw = document.getElementById("rotMembers").value;
    const startPerson = document.getElementById("rotStartPerson").value.trim();

    if (!effDate || effDate < "2026-10-01") {
      alert("生效起始日期不能為空且不能早於 2026-10-01！");
      return;
    }

    const members = membersRaw.split(/[,，]/).map(s => s.trim()).filter(s => s.length > 0);
    if (members.length === 0) {
      alert("請至少輸入一位輪值人員！");
      return;
    }

    let startIdx = members.indexOf(startPerson);
    if (startIdx === -1) {
      startIdx = 0; // 若沒輸入或不在名單內，預設以名單第一位開始
    }

    // 以生效日期為節點鍵值儲存至 Firebase
    const newAnchorKey = effDate.replace(/-/g, "_");
    rotationRef.child(newAnchorKey).set({
      effectiveDate: effDate,
      members: members,
      startIndex: startIdx,
      createdAt: Date.now()
    }).then(() => {
      alert(`新輪替規則已儲存！將自 ${effDate} 當日起生效，在此之前的歷史資料完全不受影響。`);
      closeRotationModal();
    });
  }

  // ==========================================
  // 8. 月份切換事件
  // ==========================================
  document.getElementById("prevMonthBtn").onclick = () => {
    if (currentYear === MIN_YEAR && currentMonth === MIN_MONTH) return;
    currentMonth--;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }
    renderCalendar();
  };

  document.getElementById("nextMonthBtn").onclick = () => {
    currentMonth++;
    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    renderCalendar();
  };

  // ==========================================
  // 9. Firebase 即時同步監聽
  // ==========================================
  // 監聽排班更動（調班、手動值班人員）
  scheduleRef.on("value", snapshot => {
    scheduleData = snapshot.val() || {};
    document.getElementById("syncStatus").innerText = "● 已即時連線同步";
    renderCalendar();
  });

  // 監聽輪替規則錨點
  rotationRef.on("value", snapshot => {
    const data = snapshot.val() || {};
    rotationAnchors = Object.values(data);
    renderCalendar();
  });

</script>
</body>
</html>
