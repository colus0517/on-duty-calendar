
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主管假日值班表系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK (Compat Version 10) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .sticky-header { position: sticky; top: 0; z-index: 30; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col font-sans overflow-x-hidden select-none">

  <!-- ================= 頂部極致微型導航列 (高度最小化) ================= -->
  <header class="bg-slate-900 text-white px-3 py-1 sticky-header shadow-sm flex flex-wrap justify-between items-center gap-2 border-b border-slate-800 flex-shrink-0">
    <div class="flex items-center space-x-2">
      <div class="w-5 h-5 rounded bg-indigo-600 flex items-center justify-center text-white font-bold text-[11px] shadow-xs">
        管
      </div>
      <div>
        <h1 class="text-xs md:text-sm font-bold tracking-wide flex items-center gap-1.5">
          <span>主管假日值班表</span>
          <span class="text-[9px] font-normal px-1 py-0.2 rounded bg-indigo-900/70 text-indigo-300 border border-indigo-700/60 hidden sm:inline-block">平日無值勤</span>
        </h1>
      </div>
      <span id="syncStatus" class="ml-1 text-[10px] px-1.5 py-0.2 rounded bg-amber-900/60 text-amber-200 border border-amber-700/60 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span>連線中...</span>
      </span>
    </div>

    <!-- 視圖切換與備份按鈕 (微型化) -->
    <div class="flex items-center space-x-1 text-[11px] md:text-xs">
      <button onclick="switchView('calendar')" id="btn-view-cal" class="px-2 py-0.5 rounded bg-indigo-600 text-white font-semibold transition flex items-center gap-1 shadow-xs">
        <i class="fa-regular fa-calendar-days text-[10px]"></i>
        <span>值班月曆</span>
      </button>
      <button onclick="switchView('managers')" id="btn-view-mgr" class="px-2 py-0.5 rounded text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-user-gear text-[10px]"></i>
        <span>主管名冊</span>
      </button>
      <button onclick="switchView('rules')" id="btn-view-rules" class="px-2 py-0.5 rounded text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-sliders text-[10px]"></i>
        <span>輪替規則</span>
      </button>
      <button onclick="switchView('logs')" id="btn-view-logs" class="px-2 py-0.5 rounded text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-clock-rotate-left text-[10px]"></i>
        <span>異動紀錄</span>
      </button>

      <div class="h-3 w-px bg-slate-700 mx-0.5"></div>

      <button onclick="exportData()" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700 transition" title="匯出備份">
        <i class="fa-solid fa-download"></i>
      </button>
      <label class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700 cursor-pointer transition" title="匯入備份">
        <i class="fa-solid fa-upload"></i>
        <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="importData(event)">
      </label>
    </div>
  </header>

  <!-- ================= 主內容區域 (填滿高度，一屏裝下全月) ================= -->
  <main class="flex-1 w-full max-w-7xl mx-auto p-1 md:p-2.5 flex flex-col min-h-0 overflow-y-auto">

    <!-- 視圖 1: 值班月曆 (極致緊湊，一屏裝下全月) -->
    <div id="view-calendar" class="flex-1 flex flex-col min-h-0 gap-1">

      <!-- 控制列：年月跳轉 + 主管圖例名冊 (超微型高密度排版) -->
      <div class="bg-white px-2 py-1 rounded border border-slate-200 shadow-2xs flex flex-wrap justify-between items-center gap-1.5 flex-shrink-0">
        <div class="flex items-center space-x-1">
          <button onclick="changeMonth(-1)" class="w-5 h-5 border rounded hover:bg-slate-100 text-slate-600 text-xs font-bold transition flex items-center justify-center">◀</button>
          <span id="calendar-title" class="text-xs md:text-sm font-bold text-slate-800 min-w-[90px] text-center">-- 年 -- 月</span>
          <button onclick="changeMonth(1)" class="w-5 h-5 border rounded hover:bg-slate-100 text-slate-600 text-xs font-bold transition flex items-center justify-center">▶</button>
          <button onclick="jumpToToday()" class="px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded text-[10px] font-semibold border border-indigo-200 transition">今天</button>
        </div>

        <!-- 主管代表字微型圖例 (只佔一行，字體極小化) -->
        <div id="manager-legend-bar" class="flex items-center gap-1 overflow-x-auto py-0.5 max-w-md md:max-w-xl text-[10px]"></div>

        <div class="flex items-center space-x-1">
          <button onclick="openSwapModal()" class="px-2 py-0.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-[11px] font-semibold shadow-2xs transition flex items-center gap-1">
            <i class="fa-solid fa-right-left text-[10px]"></i>
            <span>調班申請</span>
          </button>
        </div>
      </div>

      <!-- 月曆主卡片 (撐滿高度，無外滾輪) -->
      <div class="bg-white rounded border border-slate-200 flex-1 flex flex-col min-h-0 overflow-hidden shadow-2xs">
        <!-- 星期標題 (緊縮高度) -->
        <div class="grid grid-cols-7 text-center font-bold text-[11px] md:text-xs bg-slate-100/90 border-b border-slate-200 text-slate-600 py-0.5 flex-shrink-0">
          <div>週一</div>
          <div>週二</div>
          <div>週三</div>
          <div>週四</div>
          <div>週五</div>
          <div class="text-rose-600 bg-rose-50/50">週六</div>
          <div class="text-rose-600 bg-rose-50/50">週日</div>
        </div>
        <!-- 月曆格點 (自適應均分剩餘高度) -->
        <div id="calendar-grid" class="grid grid-cols-7 border-collapse bg-slate-200 gap-px flex-1 min-h-0"></div>
      </div>
    </div>

    <!-- 視圖 2: 主管名冊與代表字/顏色設定 -->
    <div id="view-managers" class="hidden space-y-3 bg-white p-3 rounded-lg border border-slate-200 shadow-sm overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h2 class="text-xs md:text-sm font-bold text-slate-800">主管名冊設定 (代表國字與專屬顏色)</h2>
          <p class="text-[11px] text-slate-500">自訂每位主管之代表國字與色彩標記，手機直向瀏覽一目了然。</p>
        </div>
        <button onclick="addNewManagerPrompt()" class="px-2 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold shadow-2xs transition">
          <i class="fa-solid fa-plus mr-1"></i>新增主管
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-600 border-y border-slate-200">
            <tr>
              <th class="py-1.5 px-3 w-12 text-center">徽章</th>
              <th class="py-1.5 px-3">主管全名</th>
              <th class="py-1.5 px-3 w-20 text-center">代表字</th>
              <th class="py-1.5 px-3 w-32">專屬顏色</th>
              <th class="py-1.5 px-3 w-16 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="manager-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>

    <!-- 視圖 3: 輪替規則設定 -->
    <div id="view-rules" class="hidden space-y-3 bg-white p-3 rounded-lg border border-slate-200 shadow-sm overflow-y-auto">
      <div class="border-b pb-2">
        <h2 class="text-xs md:text-sm font-bold text-slate-800">主管假日值班輪替規則設定</h2>
        <p class="text-[11px] text-slate-500">依設定之「生效起始日」與「起始主管」，在週末與國定連假日自動循環排班。</p>
      </div>

      <div class="max-w-md space-y-2.5 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-0.5">規則生效起始日期 *</label>
          <input type="date" id="rule-start-date" class="w-full border rounded p-1.5 bg-white text-xs">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-0.5">起始值班主管 *</label>
          <select id="rule-start-manager" class="w-full border rounded p-1.5 bg-white text-xs"></select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-0.5">循環名單順序</label>
          <div id="rule-order-list" class="space-y-1 p-1 bg-white border rounded max-h-52 overflow-y-auto"></div>
        </div>
        <button onclick="saveRuleSettings()" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-semibold transition text-xs shadow-2xs">
          儲存並重新計算輪替
        </button>
      </div>
    </div>

    <!-- 視圖 4: 異動紀錄 -->
    <div id="view-logs" class="hidden space-y-3 bg-white p-3 rounded-lg border border-slate-200 shadow-sm overflow-y-auto">
      <div class="border-b pb-2">
        <h2 class="text-xs md:text-sm font-bold text-slate-800">排班與換班稽核紀錄 (Audit Log)</h2>
        <p class="text-[11px] text-slate-500">記錄調班操作之人員、時間與原因。</p>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-600 border-y border-slate-200">
            <tr>
              <th class="py-1.5 px-3 w-32">異動時間</th>
              <th class="py-1.5 px-3 w-20">修改者</th>
              <th class="py-1.5 px-3">異動說明</th>
            </tr>
          </thead>
          <tbody id="logs-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ================= 換班 / 調班彈跳視窗 ================= -->
  <div id="swapModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-3.5 space-y-2.5 border border-slate-100 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-xs md:text-sm text-slate-800 flex items-center gap-1.5">
          <i class="fa-solid fa-right-left text-indigo-600"></i>
         <span>申請主管換班 / 調班</span>
        </h3>
        <button onclick="closeSwapModal()" class="text-slate-400 hover:text-slate-600 text-base">✕</button>
      </div>

      <div class="space-y-2">
        <div>
          <label class="block font-semibold text-slate-700 mb-0.5">欲換班日期 (限假日或國定假日) *</label>
          <input type="date" id="swap-date" onchange="onSwapDateSelected()" class="w-full border rounded p-1.5 bg-white text-xs">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-0.5">原定值班主管</label>
            <input type="text" id="swap-original-mgr" readonly class="w-full border rounded p-1.5 bg-slate-100 text-slate-600 font-bold">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-0.5">替換主管 *</label>
            <select id="swap-target-mgr" class="w-full border rounded p-1.5 bg-white text-xs font-semibold"></select>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-0.5">修改人姓名 (操作者) *</label>
          <select id="swap-editor" class="w-full border rounded p-1.5 bg-white text-xs font-semibold"></select>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-0.5">換班原因備註</label>
          <input type="text" id="swap-reason" placeholder="如：主管出差換班..." class="w-full border rounded p-1.5 text-xs">
        </div>
      </div>

      <div class="flex justify-end space-x-2 border-t pt-2">
        <button onclick="closeSwapModal()" class="px-2.5 py-1 border rounded text-slate-600 hover:bg-slate-50">取消</button>
        <button onclick="executeSwap()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-semibold">確認換班</button>
      </div>
    </div>
  </div>

    const today = new Date();
    let calYear = today.getFullYear();
    let calMonth = today.getMonth() + 1;

    function initFirebase() {
      const statusEl = document.getElementById('syncStatus');
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseConnected = true;

        statusEl.className = "ml-1 text-[10px] px-1.5 py-0.2 rounded bg-emerald-900/60 text-emerald-200 border border-emerald-700/60 flex items-center gap-1";

            if (data.rule) rule = data.rule;
            if (data.manualOverrides) manualOverrides = data.manualOverrides;
            if (data.auditLogs) auditLogs = data.auditLogs;

            localStorage.setItem('exec_managers', JSON.stringify(managers));
            localStorage.setItem('exec_rule', JSON.stringify(rule));
            localStorage.setItem('exec_overrides', JSON.stringify(manualOverrides));
            localStorage.setItem('exec_logs', JSON.stringify(auditLogs));

            renderCalendar();
            renderManagersView();
            renderRuleView();
            renderLogsView();
          } else {
            syncToFirebase();
          }
        });
      } catch (err) {
        statusEl.className = "ml-1 text-[10px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-300 border border-slate-700 flex items-center gap-1";
        statusEl.innerHTML = `<span>離線</span>`;
      }
    }

    function syncToFirebase() {
      if (isFirebaseConnected && db) {
        db.ref('executiveDutyRoster').set({
          managers: managers,
          rule: rule,
          manualOverrides: manualOverrides,
          auditLogs: auditLogs,
          lastUpdated: new Date().toISOString()
        });
      }
    }

    function saveState() {
      localStorage.setItem('exec_managers', JSON.stringify(managers));
      localStorage.setItem('exec_rule', JSON.stringify(rule));
      localStorage.setItem('exec_overrides', JSON.stringify(manualOverrides));
      localStorage.setItem('exec_logs', JSON.stringify(auditLogs));
      syncToFirebase();
      renderCalendar();
      renderManagersView();
      renderRuleView();
      renderLogsView();
    }

    // 判斷是否為放假日（週六、週日、國定假日與連續假期補假）
    function isHoliday(dateStr) {
      const d = new Date(dateStr);
      const dayOfWeek = d.getDay();
      if (dayOfWeek === 0 || dayOfWeek === 6) return true;
      return !!TAIWAN_HOLIDAYS[dateStr];
    }

    // 獲取當天主管排班
    function getDutyManager(dateStr) {
      if (!isHoliday(dateStr)) return null;

      if (manualOverrides[dateStr]) {
        return managers.find(m => m.id === manualOverrides[dateStr]) || null;
      }

      const count = countHolidaysBetween(rule.startDate, dateStr);
      if (count === null) return null;

      const orderList = rule.orderIds && rule.orderIds.length > 0 ? rule.orderIds : managers.map(m => m.id);
      const startIdx = orderList.indexOf(rule.startManagerId);
      const safeStartIdx = startIdx >= 0 ? startIdx : 0;

      const targetIdx = (safeStartIdx + count) % orderList.length;
      const targetId = orderList[targetIdx >= 0 ? targetIdx : (targetIdx + orderList.length) % orderList.length];

      return managers.find(m => m.id === targetId) || null;
    }

    function countHolidaysBetween(startStr, targetStr) {
      const dStart = new Date(startStr);
      const dTarget = new Date(targetStr);

      if (startStr === targetStr) return 0;

      const forward = dTarget > dStart;
      let cur = new Date(dStart);
      let count = 0;

      if (forward) {
        while (formatDate(cur) < targetStr) {
          cur.setDate(cur.getDate() + 1);
          if (isHoliday(formatDate(cur))) count++;
        }
        return count;
      } else {
        while (formatDate(cur) > targetStr) {
          cur.setDate(cur.getDate() - 1);
          if (isHoliday(formatDate(cur))) count--;
        }
        return count;
      }
    }

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getTodayString() {
      return formatDate(new Date());
    }

    function switchView(view) {
      ['calendar', 'managers', 'rules', 'logs'].forEach(v => {
        document.getElementById(`view-${v}`).classList.toggle('hidden', view !== v);
      });

      const buttons = {
        calendar: 'btn-view-cal',
        managers: 'btn-view-mgr',
        rules: 'btn-view-rules',
        logs: 'btn-view-logs'
      };

      Object.entries(buttons).forEach(([v, id]) => {
        const btn = document.getElementById(id);
        if (v === view) {
          btn.className = "px-2 py-0.5 rounded bg-indigo-600 text-white font-semibold transition flex items-center gap-1 shadow-xs";
       } else {
          btn.className = "px-2 py-0.5 rounded text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-1";
        }
      });

      if (view === 'calendar') renderCalendar();
      if (view === 'managers') renderManagersView();
      if (view === 'rules') renderRuleView();
      if (view === 'logs') renderLogsView();
    }

    function renderCalendar() {
      document.getElementById('calendar-title').innerText = `${calYear} 年 ${calMonth} 月`;
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      renderLegendBar();

      const firstDay = new Date(calYear, calMonth - 1, 1);
      const daysInMonth = new Date(calYear, calMonth, 0).getDate();
      const startDayOffset = (firstDay.getDay() + 6) % 7;

      for (let i = 0; i < startDayOffset; i++) {
        const empty = document.createElement('div');
        empty.className = 'bg-slate-50/50 border-b border-slate-200 min-h-[46px]';
        grid.appendChild(empty);
      }

      const todayStr = getTodayString();

      for (let d = 1; d <= daysInMonth; d++) {
        const curDate = new Date(calYear, calMonth - 1, d);
        const dateKey = formatDate(curDate);
        const isHol = isHoliday(dateKey);
        const isSatSun = curDate.getDay() === 0 || curDate.getDay() === 6;
        const holName = TAIWAN_HOLIDAYS[dateKey];
        const isToday = dateKey === todayStr;

        const dutyMgr = getDutyManager(dateKey);
        const isOverridden = manualOverrides[dateKey];

        const cell = document.createElement('div');
        // 高度縮減，手機與桌機均能自適應壓縮
        cell.className = `p-1 flex flex-col justify-between border-b border-slate-200 transition min-h-[46px] md:min-h-[56px] ${
          isHol ? (isSatSun ? 'bg-rose-50/30' : 'bg-amber-50/30') : 'bg-white'
        } hover:bg-indigo-50/40 group relative`;

        // 頂部日期
        let headerHtml = `
          <div class="flex justify-between items-center leading-none">
            <div class="flex items-center gap-1">
              <span class="text-[11px] md:text-xs font-bold ${isToday ? 'w-4 h-4 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px]' : (isHol ? 'text-rose-600' : 'text-slate-700')}">${d}</span>
              ${holName ? `<span class="text-[9px] px-1 rounded bg-rose-100 text-rose-700 font-medium scale-90 origin-left truncate max-w-[70px]">${holName}</span>` : ''}
            </div>
            ${isHol ? `
              <button onclick="openSwapModal('${dateKey}')" class="opacity-0 group-hover:opacity-100 text-[9px] px-1 py-0.2 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-medium transition" title="調班">
               調
              </button>
            ` : ''}
          </div>
        `;

        // 主管代表國字 (精巧徽章，不浪費任何高度)
        let bodyHtml = '';
        if (isHol && dutyMgr) {
          const colorObj = COLOR_PALETTE[dutyMgr.colorIdx || 0] || COLOR_PALETTE[0];
          bodyHtml = `
            <div class="mt-auto py-0.5 px-1 rounded bg-white/95 border border-slate-200 shadow-2xs flex items-center justify-between gap-1">
              <div class="flex items-center gap-1 min-w-0">
                <span class="w-4 h-4 md:w-5 md:h-5 rounded ${colorObj.bg} ${colorObj.text} font-bold text-[9px] md:text-[11px] flex items-center justify-center flex-shrink-0 shadow-2xs">
                  ${dutyMgr.char || dutyMgr.name.slice(-1)}
                </span>
                <span class="text-[10px] md:text-[11px] font-bold text-slate-800 truncate leading-tight">${dutyMgr.name}</span>
              </div>
              ${isOverridden ? '<span class="text-[8px] px-0.5 rounded bg-indigo-100 text-indigo-700 font-semibold flex-shrink-0">換</span>' : ''}
            </div>
          `;
        } else if (!isHol) {
          bodyHtml = `
            <div class="mt-auto text-center text-slate-200 text-[10px] font-light select-none">
              —
            </div>
          `;
        }

        cell.innerHTML = headerHtml + bodyHtml;
        grid.appendChild(cell);
      }
    }

    function renderLegendBar() {
      const container = document.getElementById('manager-legend-bar');
      container.innerHTML = '';
      managers.forEach(mgr => {
        const color = COLOR_PALETTE[mgr.colorIdx || 0] || COLOR_PALETTE[0];
        const item = document.createElement('div');
        item.className = "flex items-center gap-1 flex-shrink-0 px-1.5 py-0.2 rounded-full bg-slate-100 border border-slate-200 text-[10px]";
        item.innerHTML = `
          <span class="w-3.5 h-3.5 rounded-full ${color.bg} ${color.text} text-[9px] font-bold flex items-center justify-center">
            ${mgr.char || mgr.name.slice(-1)}
          </span>
          <span class="font-medium text-slate-700 text-[10px]">${mgr.name}</span>
        `;
        container.appendChild(item);
      });
    }

    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      else if (calMonth < 1) { calMonth = 12; calYear--; }
      renderCalendar();
    }

    function jumpToToday() {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth() + 1;
      renderCalendar();
    }

    function renderManagersView() {
      const tbody = document.getElementById('manager-table-body');
      tbody.innerHTML = '';

      managers.forEach((mgr) => {
        const color = COLOR_PALETTE[mgr.colorIdx || 0] || COLOR_PALETTE[0];
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition";

        tr.innerHTML = `
          <td class="py-1.5 px-3 text-center">
            <span class="w-5 h-5 rounded ${color.bg} ${color.text} font-bold text-xs inline-flex items-center justify-center shadow-2xs">
              ${mgr.char || mgr.name.slice(-1)}
            </span>
          </td>
          <td class="py-1.5 px-3">
            <input type="text" value="${mgr.name}" onchange="updateManagerName('${mgr.id}', this.value)" class="border rounded px-2 py-0.5 font-semibold text-slate-800 text-xs">
          </td>
          <td class="py-1.5 px-3 text-center">
            <input type="text" maxlength="1" value="${mgr.char || mgr.name.slice(-1)}" onchange="updateManagerChar('${mgr.id}', this.value)" class="w-7 text-center border rounded py-0.5 font-bold text-xs bg-slate-50">
          </td>
          <td class="py-1.5 px-3">
            <select onchange="updateManagerColor('${mgr.id}', this.value)" class="border rounded p-0.5 text-xs">
              ${COLOR_PALETTE.map((c, i) => `<option value="${i}" ${i === (mgr.colorIdx || 0) ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </td>
          <td class="py-1.5 px-3 text-right">
            <button onclick="deleteManager('${mgr.id}')" class="text-rose-500 hover:text-rose-700 font-semibold text-xs">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateManagerName(id, val) {
      const mgr = managers.find(m => m.id === id);
      if (mgr && val.trim()) {
        mgr.name = val.trim();
        saveState();
      }
    }

    function updateManagerChar(id, val) {
      const mgr = managers.find(m => m.id === id);
      if (mgr && val.trim()) {
        mgr.char = val.trim().slice(-1);
        saveState();
      }
    }

    function updateManagerColor(id, colorIdx) {
      const mgr = managers.find(m => m.id === id);
      if (mgr) {
        mgr.colorIdx = parseInt(colorIdx, 10);
        saveState();
      }
    }

    function addNewManagerPrompt() {
      const name = prompt('請輸入新主管姓名：');
      if (!name || !name.trim()) return;
      const char = prompt('請輸入代表國字（1 個字，如：豪）：', name.trim().slice(-1)) || name.trim().slice(-1);

      const newMgr = {
        id: 'm_' + Date.now(),
        name: name.trim(),
        char: char.slice(-1),
        colorIdx: managers.length % COLOR_PALETTE.length
      };

      managers.push(newMgr);
      if (!rule.orderIds.includes(newMgr.id)) {
        rule.orderIds.push(newMgr.id);
      }
      saveState();
    }

    function deleteManager(id) {
      if (managers.length <= 2) { alert('至少需保留 2 位主管供輪替！'); return; }
      if (confirm('確定要移除此位主管嗎？')) {
        managers = managers.filter(m => m.id !== id);
        rule.orderIds = rule.orderIds.filter(mid => mid !== id);
        if (rule.startManagerId === id) {
          rule.startManagerId = managers[0].id;
        }
        saveState();
      }
    }

    function renderRuleView() {
      document.getElementById('rule-start-date').value = rule.startDate;

      const selectMgr = document.getElementById('rule-start-manager');
     selectMgr.innerHTML = '';
      managers.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.innerText = `${m.name} (${m.char})`;
        if (m.id === rule.startManagerId) opt.selected = true;
        selectMgr.appendChild(opt);
      });

      const orderList = document.getElementById('rule-order-list');
      orderList.innerHTML = '';
      const orderIds = rule.orderIds || managers.map(m => m.id);

      orderIds.forEach((mid, idx) => {
        const m = managers.find(mgr => mgr.id === mid);
        if (!m) return;
        const color = COLOR_PALETTE[m.colorIdx || 0] || COLOR_PALETTE[0];
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-1 rounded bg-slate-50 border border-slate-200 text-xs";
        row.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="w-3 text-[10px] font-bold text-slate-400 text-center">${idx + 1}</span>
            <span class="w-4 h-4 rounded ${color.bg} ${color.text} text-[10px] font-bold flex items-center justify-center">${m.char}</span>
            <span class="font-semibold text-slate-700">${m.name}</span>
          </div>
          <div class="flex items-center gap-1 text-slate-400 text-[10px]">
            <button onclick="moveOrder(${idx}, -1)" class="hover:text-indigo-600 px-1">▲</button>
            <button onclick="moveOrder(${idx}, 1)" class="hover:text-indigo-600 px-1">▼</button>
          </div>
        `;
        orderList.appendChild(row);
      });
    }

    function moveOrder(idx, delta) {
      const order = [...rule.orderIds];
      const target = idx + delta;
      if (target < 0 || target >= order.length) return;
      const temp = order[idx];
      order[idx] = order[target];
      order[target] = temp;
      rule.orderIds = order;
      renderRuleView();
    }

    function saveRuleSettings() {
      rule.startDate = document.getElementById('rule-start-date').value;
      rule.startManagerId = document.getElementById('rule-start-manager').value;
      saveState();
      alert('輪替規則已成功更新！');
    }

    function openSwapModal(defaultDate = null) {
      const modal = document.getElementById('swapModal');
      const inputDate = document.getElementById('swap-date');
      const selectTarget = document.getElementById('swap-target-mgr');
      const selectEditor = document.getElementById('swap-editor');

      inputDate.value = defaultDate || getTodayString();

      selectTarget.innerHTML = '';
      selectEditor.innerHTML = '';
      managers.forEach(m => {
        const opt1 = document.createElement('option');
        opt1.value = m.id;
        opt1.innerText = `${m.name} (${m.char})`;
        selectTarget.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = m.name;
        opt2.innerText = m.name;
        selectEditor.appendChild(opt2);
      });

      onSwapDateSelected();
      modal.classList.remove('hidden');
    }

    function closeSwapModal() {
      document.getElementById('swapModal').classList.add('hidden');
    }

    function onSwapDateSelected() {
      const dateVal = document.getElementById('swap-date').value;
      if (!isHoliday(dateVal)) {
        document.getElementById('swap-original-mgr').value = '平日無值勤（請選假日）';
        return;
      }
      const curMgr = getDutyManager(dateVal);
      document.getElementById('swap-original-mgr').value = curMgr ? `${curMgr.name} (${curMgr.char})` : '未排定';
    }

    function executeSwap() {
      const dateVal = document.getElementById('swap-date').value;
      const targetId = document.getElementById('swap-target-mgr').value;
      const editorName = document.getElementById('swap-editor').value;
      const reason = document.getElementById('swap-reason').value.trim() || '主管調班';

      if (!isHoliday(dateVal)) {
        alert('選取之日期為平日，平日無主管值班需求！');
        return;
      }

      const origMgr = getDutyManager(dateVal);
      const targetMgr = managers.find(m => m.id === targetId);

      if (!targetMgr) return;
      if (origMgr && origMgr.id === targetId) {
        alert('替換主管不能與原定值班主管相同！');
        return;
      }

      manualOverrides[dateVal] = targetId;

      const logEntry = {
        time: new Date().toLocaleString('zh-TW', { hour12: false }),
        editor: editorName,
        action: `【換班】${dateVal} 由 [${origMgr ? origMgr.name : '未定'}] 更換為 [${targetMgr.name}]。原因：${reason}`
      };
      auditLogs.unshift(logEntry);

      saveState();
      closeSwapModal();
      alert(`已成功將 ${dateVal} 主管值班換成 ${targetMgr.name}！`);
    }

    function renderLogsView() {
      const tbody = document.getElementById('logs-table-body');
      tbody.innerHTML = '';
      if (auditLogs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-1 text-slate-400">目前尚無異動紀錄</td></tr>`;
        return;
      }
      auditLogs.forEach(log => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-1 px-3 text-slate-500 whitespace-nowrap">${log.time}</td>
          <td class="py-1 px-3 font-semibold text-slate-800 whitespace-nowrap">${log.editor}</td>
          <td class="py-1 px-3 text-slate-700">${log.action}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportData() {
      const data = { managers, rule, manualOverrides, auditLogs, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `executive_duty_${getTodayString()}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.managers) managers = imported.managers;
          if (imported.rule) rule = imported.rule;
          if (imported.manualOverrides) manualOverrides = imported.manualOverrides;
          if (imported.auditLogs) auditLogs = imported.auditLogs;
          saveState();
          alert('主管值班資料已成功匯入！');
        } catch (err) {
          alert('匯入失敗：非合法格式！');
        }
      };
      reader.readAsText(file);
    }

    window.onload = () => {
     initFirebase();
      renderCalendar();
      renderManagersView();
      renderRuleView();
      renderLogsView();
    };
  </script>
</body>
</html>
